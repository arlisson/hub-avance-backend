<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leads | AVANCE</title>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./leads.css" />
    <link rel="stylesheet" href="../ui/ui-feedback.css" />
    <link rel="stylesheet" href="../shared/loading.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-container">
        <a href="../paginaUnificada/index.html">
          <img
            src="../img/LogoEscuroSemFundo.png"
            alt="Logo Avance"
            class="company-logo"
          />
        </a>
      </div>

      <div class="chat-list" style="margin-top: 20px">
        <button class="chat-item active" type="button">
          <i class="ph ph-bell-ringing"></i>
          <div class="chat-info">
            <div class="chat-title">Leads recebidos</div>
            <div class="chat-date">Contatos e solicitações</div>
          </div>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-item user-info-item" id="sidebar-userbar">
          <i class="ph ph-envelope-simple"></i>
          <span class="user-email-text" id="user-email"></span>

          <button
            class="settings-dots"
            id="settings-btn"
            type="button"
            aria-label="Configurações"
          >
            <i class="ph ph-dots-three-vertical"></i>
          </button>

          <div class="settings-dropdown" id="settings-menu" hidden>
            <a href="../perfil/perfil.html" class="dropdown-item">
              <i class="ph ph-user"></i>
              <span>Perfil</span>
            </a>
            <button type="button" class="dropdown-item" id="menu-back-hub">
              <i class="ph ph-house"></i>
              <span>Voltar ao Hub</span>
            </button>
            <button type="button" class="dropdown-item danger" id="menu-logout">
              <i class="ph ph-sign-out"></i>
              <span>Sair</span>
            </button>
          </div>
        </div>

        <button class="sidebar-footer-item" id="theme-toggle" type="button">
          <i class="ph ph-moon"></i>
          <span>Modo escuro</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="chat-header">
        <button
          class="mobile-menu-btn"
          id="mobile-menu-btn"
          type="button"
          aria-label="Abrir menu"
        >
          <i class="ph ph-list"></i>
        </button>

        <div class="assistant-info">
          <div class="assistant-avatar">
            <i class="ph ph-bell-ringing"></i>
          </div>
          <div class="assistant-details">
            <span class="name">Leads recebidos</span>
            <span class="status">Contatos e solicitações via Hub</span>
          </div>
        </div>
      </header>

      <section class="protocol-wrap">
        <div class="protocol-card">
          <h1 class="protocol-title">Leads recebidos</h1>
          <p class="protocol-subtitle">
            Contatos de clientes que solicitaram atendimento via Hub.
          </p>

          <div id="errorBox" class="error" hidden></div>

          <div class="field" style="margin-bottom: 12px">
            <label for="search">Buscar</label>
            <input
              id="search"
              class="input-dark-lite"
              type="text"
              placeholder="Nome, CPF/CNPJ, WhatsApp..."
              autocomplete="off"
            />
          </div>

          <div class="filter-bar" id="filter-bar">
            <div class="filter-bar-header">
              <button
                class="filter-bar-toggle"
                id="filter-bar-toggle"
                type="button"
              >
                <i class="ph ph-funnel"></i>
                <span>Filtros</span>
                <i class="ph ph-caret-down filter-caret" id="filter-caret"></i>
              </button>
              <span class="filter-active-count" id="filter-active-count" hidden></span>
              <button class="btn-clear-filters" id="btn-clear-filters" type="button" hidden>
                <i class="ph ph-x-circle"></i>
                Limpar filtros
              </button>
            </div>

            <div class="filter-bar-body" id="filter-bar-body" hidden>
              <div class="filter-group">
                <label class="filter-label">Status</label>
                <div class="filter-multiselect" id="filter-status-wrap">
                  <button type="button" class="filter-multiselect-btn" id="filter-status-btn">
                    <span id="filter-status-label">Todos</span>
                    <i class="ph ph-caret-down"></i>
                  </button>
                  <ul class="filter-multiselect-dropdown filter-single-dropdown" id="filter-status-dropdown" hidden>
                    <li class="filter-single-item is-selected" data-value="">Todos</li>
                    <li class="filter-single-item" data-value="false">Pendente</li>
                    <li class="filter-single-item" data-value="true">Atendido</li>
                  </ul>
                  <input type="hidden" id="filter-status" />
                </div>
              </div>

              <div class="filter-group">
                <label class="filter-label">Serviço</label>
                <div class="filter-multiselect" id="filter-servico-wrap">
                  <button type="button" class="filter-multiselect-btn" id="filter-servico-btn">
                    <span id="filter-servico-label">Todos</span>
                    <i class="ph ph-caret-down"></i>
                  </button>
                  <ul class="filter-multiselect-dropdown filter-single-dropdown" id="filter-servico-dropdown" hidden>
                    <li class="filter-single-item is-selected" data-value="">Todos</li>
                    <li class="filter-single-item" data-value="movel">Telefonia móvel</li>
                    <li class="filter-single-item" data-value="internet">Internet</li>
                    <li class="filter-single-item" data-value="fixa">Telefonia fixa</li>
                  </ul>
                  <input type="hidden" id="filter-servico" />
                </div>
              </div>
            </div>
          </div>

          <div class="filter-export-row">
            <span class="filter-result-count" id="filter-result-count"></span>
            <button class="btn-export-excel" id="btn-export-excel" type="button">
              <i class="ph ph-microsoft-excel-logo"></i>
              Exportar para Excel
            </button>
          </div>

          <div class="table-wrap">
            <table class="users-table leads-table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>WhatsApp</th>
                  <th>CPF/CNPJ</th>
                  <th>Serviço</th>
                  <th>Data de envio</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="leads-table-body"></tbody>
            </table>
          </div>

          <div id="pagination-controls"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="../shared/loading.js"></script>
    <script src="./leads.js" defer></script>
    <script src="../ui/ui-feedback.js"></script>
  </body>
</html>
